name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npm run check

      - name: Build runtime and parser assets before runtime tests
        run: npm run build

      - name: Full test suite
        run: npm test -- --reporter=json --outputFile="$RUNNER_TEMP/symbollattice-tests.json"

      - name: Verify language admission and worker generation
        run: |
          npm run verify:language-depth -- --output "$RUNNER_TEMP/symbollattice-depth.json"
          npm run verify:mcp-worker-generation
          node benchmarks/languages/nonempty-depth-lifecycle.mjs --output "$RUNNER_TEMP/symbollattice-lifecycle.json"

      - name: Pack with prepack enabled and verify an isolated installation
        run: node scripts/release/verify-local-pack.mjs --output "$RUNNER_TEMP/symbollattice-pack.json"

      - name: Self-index and verify bounded read concurrency
        run: |
          node dist/cli/main.js init . --json
          node benchmarks/mcp/read-query-concurrency.mjs --project . --pool 4 --concurrency 4 --output "$RUNNER_TEMP/symbollattice-concurrency-4.json"
          node benchmarks/mcp/read-query-concurrency.mjs --project . --pool 4 --concurrency 16 --output "$RUNNER_TEMP/symbollattice-concurrency-16.json"

      - name: Retain verification receipts even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verification-${{ matrix.os }}-node${{ matrix.node }}
          path: ${{ runner.temp }}/symbollattice-*.json
          if-no-files-found: warn
          retention-days: 14
