name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Verify the annotated tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          test "$(git cat-file -t "$GITHUB_REF_NAME")" = "tag"
          test "$(git rev-list -n 1 "$GITHUB_REF_NAME")" = "$GITHUB_SHA"

      - name: Install locked dependencies
        run: npm ci

      - name: Verify source and runtime
        run: |
          npm run check
          npm test
          npm run build
          npm run verify:mcp-worker-generation

      - name: Pack the release artifact
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          mkdir release
          npm pack --json --silent --pack-destination release > "$RUNNER_TEMP/pack.json"
          node --input-type=module - "$RUNNER_TEMP/pack.json" >> "$GITHUB_OUTPUT" <<'NODE'
          import { readFileSync, renameSync } from "node:fs";
          const result = JSON.parse(readFileSync(process.argv[2], "utf8"));
          if (!Array.isArray(result) || result.length !== 1 || typeof result[0]?.filename !== "string") {
            throw new Error("npm pack did not return exactly one artifact filename.");
          }
          const version = process.env.GITHUB_REF_NAME?.replace(/^v/, "");
          if (typeof version !== "string" || version.length === 0) {
            throw new Error("The release tag does not provide an artifact version.");
          }
          const filename = `SymbolLattice-${version}.tgz`;
          renameSync(`release/${result[0].filename}`, `release/${filename}`);
          process.stdout.write(`filename=${filename}\n`);
          NODE

      - name: Create checksum and release manifest
        shell: bash
        run: |
          set -euo pipefail
          npm run release:contract -- \
            --tag "$GITHUB_REF_NAME" \
            --commit "$GITHUB_SHA" \
            --tarball "release/${{ steps.pack.outputs.filename }}" \
            --output-dir release

      - name: Verify a clean tarball installation
        shell: bash
        run: |
          set -euo pipefail
          install_prefix="$RUNNER_TEMP/SymbolLattice-install"
          tarball_path="$GITHUB_WORKSPACE/release/${{ steps.pack.outputs.filename }}"
          npm install --prefix "$install_prefix" "$tarball_path"
          installed_version="$("$install_prefix/node_modules/.bin/SymbolLattice" --version)"
          test "$installed_version" = "${GITHUB_REF_NAME#v}"

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@78e6cbd37d0ac1a40113c04f2037dacf1ea3f12e # v4
        with:
          subject-path: release/*

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" release/* \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME"

      - name: Verify the published release evidence
        shell: bash
        run: |
          set -euo pipefail
          verification_output="$RUNNER_TEMP/release-verification.json"
          verification_error="$RUNNER_TEMP/release-verification.stderr"
          for attempt in 1 2 3 4 5 6; do
            if node dist/cli/main.js upgrade "${GITHUB_REF_NAME#v}" --verify --json \
              > "$verification_output" 2> "$verification_error"; then
              cat "$verification_output"
              exit 0
            fi
            if test "$attempt" -lt 6; then
              sleep 5
            fi
          done
          cat "$verification_error" >&2
          exit 1
